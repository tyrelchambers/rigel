name: Build Assistant agent image

on:
  push:
    branches: [master]
    paths:
      - "agent/**"
      # The agent image bundles @rigel/k8s by source (esbuild), so a shared-package
      # change must rebuild it too — otherwise the deployed agent runs stale code.
      - "packages/k8s/**"
      # ...but tests aren't bundled into the image, so a test-only change to either
      # is a no-op for the agent — don't rebuild (or bump its version) for those.
      - "!agent/**/*.test.ts"
      - "!packages/k8s/**/*.test.ts"
      - ".github/workflows/agent-build.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rigel-assistant

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute continuous version
        id: ver
        run: |
          MAJOR_MINOR=$(node -p "require('./agent/package.json').version.split('.').slice(0,2).join('.')")
          if ! printf '%s' "$MAJOR_MINOR" | grep -Eq '^[0-9]+\.[0-9]+$'; then
            echo "::error::agent/package.json version is not X.Y.Z"; exit 1
          fi
          echo "version=${MAJOR_MINOR}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # No QEMU: build natively for amd64 so claude-code's installer detects the
      # runner's AVX2 CPU and bakes the AVX2 Bun build. Under QEMU emulation it
      # sees a generic no-AVX2 CPU and bakes the *baseline* Bun, which segfaults
      # during GC on kernel 6.17. All target nodes are amd64.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          # Repo root: the image bundles both agent/ and the shared packages/k8s/
          # source (esbuild inlines @rigel/k8s). Dockerfile stays under agent/.
          context: .
          file: ./agent/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-failure:
    needs: [build]
    if: failure()
    uses: ./.github/workflows/ci-failure-issue.yml
    with:
      workflow: Build Assistant agent image
    permissions:
      issues: write
