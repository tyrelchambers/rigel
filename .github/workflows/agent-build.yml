name: Build Assistant agent image

on:
  push:
    branches: [master]
    paths:
      - "agent/**"
      # The agent image bundles @rigel/k8s by source (esbuild), so a shared-package
      # change must rebuild it too — otherwise the deployed agent runs stale code.
      - "packages/k8s/**"
      # ...but tests aren't bundled into the image, so a test-only change to either
      # is a no-op for the agent — don't rebuild (or bump its version) for those.
      - "!agent/**/*.test.ts"
      - "!packages/k8s/**/*.test.ts"
      - ".github/workflows/agent-build.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rigel-assistant

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute continuous version
        id: ver
        run: |
          MAJOR_MINOR=$(node -p "require('./agent/package.json').version.split('.').slice(0,2).join('.')")
          if ! printf '%s' "$MAJOR_MINOR" | grep -Eq '^[0-9]+\.[0-9]+$'; then
            echo "::error::agent/package.json version is not X.Y.Z"; exit 1
          fi
          echo "version=${MAJOR_MINOR}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # No QEMU: build natively for amd64 so claude-code's installer detects the
      # runner's AVX2 CPU and bakes the AVX2 Bun build. Under QEMU emulation it
      # sees a generic no-AVX2 CPU and bakes the *baseline* Bun, which segfaults
      # during GC on kernel 6.17. All target nodes are amd64.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Hash ONLY the agent's built bundles (the artifact stage), not the whole
      # repo. esbuild is deterministic for identical source + pinned deps, so an
      # app-only change that tree-shakes out yields the same hash. Reuses the gha
      # cache + the job's local builder cache, so the runtime stage below doesn't
      # rebuild the `build` stage.
      - name: Compute agent content hash
        id: hash
        run: |
          docker buildx build --target artifact --file ./agent/Dockerfile \
            --output type=local,dest=./_agent_artifact --cache-from type=gha .
          HASH=$(cd ./_agent_artifact && find . -type f -exec sha256sum {} \; | LC_ALL=C sort | sha256sum | awk '{print $1}')
          echo "short=${HASH:0:16}" >> "$GITHUB_OUTPUT"
          echo "Agent content hash: ${HASH:0:16}"

      # If an image with this exact content was already published, nothing about
      # the agent changed — skip the build & push so :latest keeps its digest and
      # no new version tag appears, and the update watcher stays quiet.
      - name: Check whether this content is already published
        id: check
        run: |
          if docker buildx imagetools inspect "${IMAGE}:content-${{ steps.hash.outputs.short }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Agent content unchanged (content-${{ steps.hash.outputs.short }} already published) — skipping build & publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          # Repo root: the image bundles both agent/ and the shared packages/k8s/
          # source (esbuild inlines @rigel/k8s). Dockerfile stays under agent/.
          context: .
          file: ./agent/Dockerfile
          platforms: linux/amd64
          push: true
          # `:content-<hash>` is the idempotency key the skip check reads next time.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:content-${{ steps.hash.outputs.short }}
          labels: |
            org.rigel.agent-content-hash=${{ steps.hash.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-failure:
    needs: [build]
    if: failure()
    uses: ./.github/workflows/ci-failure-issue.yml
    with:
      workflow: Build Assistant agent image
    permissions:
      issues: write
