packages:
  - "apps/*"
  - "packages/*"
# The mac release job builds BOTH arm64 and x64 dmgs on one arm64 runner
# (release:mac → --mac --arm64 --x64), but pnpm installs only the optional
# platform packages matching the running machine. The x64 app would therefore
# ship without @livekit/rtc-ffi-bindings-darwin-x64 or
# @livekit/local-inference-darwin-x64 — electron-builder says so out loud
# ("platform-specific optional dependencies not bundled"), and the voice
# worker on an Intel Mac would fail to load its native addons.
supportedArchitectures:
  os:
    - current
  cpu:
    - x64
    - arm64

allowBuilds:
  esbuild: true
  # Transitive only (astro's optional image service, and @livekit/agents, whose
  # sharp import the voice bundle stubs out). Both resolve the prebuilt @img/*
  # binaries at runtime, so nothing needs sharp's install script, which used to
  # fall through to a libvips source build.
  sharp: false
  node-pty: true
  # Windows-only installer pulled in by electron-builder; never built on macOS.
  electron-winstaller: false
  # The voice worker's VAD (and the local turn-detector fallback) runs on this
  # native binding, so it MUST stay loadable. Its "install" script is a no-op
  # (`node -e ""`); allowing it just stops pnpm re-adding an ignored-build entry.
  '@livekit/local-inference': true
minimumReleaseAgeExclude:
  - '@iconify-json/lucide@1.2.113'
  - '@awesome.me/kit-6050953220@1.0.4'
  # Font Awesome runtime packages live on the private npm.fontawesome.com
  # registry; the minimumReleaseAge check can't authenticate to it (401), so
  # exempt them like the kit above.
  - '@fortawesome/fontawesome-common-types@7.3.1'
  - '@fortawesome/fontawesome-svg-core@7.3.1'
  - '@fortawesome/react-fontawesome@3.4.0'
  - livekit-client@2.22.0
