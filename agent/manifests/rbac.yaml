# ─────────────────────────────────────────────────────────────────────────────
# The RBAC cage — the REAL, cluster-enforced ceiling for the in-cluster assistant.
# The assistant is a full agent, but it can only ever do what THIS Role grants:
# a verb that isn't here is refused by the API server (403), no matter what the
# model or the chat confirm flow does.
#
# DEFAULT POSTURE (this file): read + REVERSIBLE mutations only. Destructive verbs
# (`delete`, pod `eviction`/drain) are DELIBERATELY ABSENT, so destructive actions
# are hard-blocked out of the box — a confirmed "yes" on a delete just 403s and the
# assistant reports which verb to grant.
#   - To ENABLE destructive: uncomment the delete/eviction rules below (the chat
#     still confirms them with "yes" before running).
#   - To OPEN IT UP further: widen the write Role to more namespaces (duplicate it).
#   - Secrets are read-omitted (no value exfiltration); add them to read/manage them.
#   - `roles`/`rolebindings`/`clusterroles` verbs are omitted (no self-escalation).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rigel-assistant
  namespace: default
  labels:
    app.kubernetes.io/name: rigel-assistant
    app.kubernetes.io/managed-by: rigel-assistant
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rigel-assistant
  labels:
    app.kubernetes.io/managed-by: rigel-assistant
rules:
  # broad read for investigation — secrets omitted by default
  - apiGroups: [""]
    resources: [pods, pods/log, pods/status, nodes, events, namespaces, services,
                endpoints, persistentvolumeclaims, persistentvolumes,
                replicationcontrollers, configmaps, serviceaccounts, resourcequotas, limitranges]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets, statefulsets, daemonsets, deployments/scale, statefulsets/scale]
    verbs: [get, list, watch]
  - apiGroups: ["batch"]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: ["events.k8s.io"]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: ["metrics.k8s.io"]
    resources: [pods, nodes]
    verbs: [get, list]
  # cordon / uncordon (reversible) = patch on the node's .spec.unschedulable
  - apiGroups: [""]
    resources: [nodes]
    verbs: [patch]
  # ── DESTRUCTIVE (opt-in): uncomment to allow `kubectl drain` ──
  # - apiGroups: [""]
  #   resources: [pods/eviction]
  #   verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rigel-assistant
  labels:
    app.kubernetes.io/managed-by: rigel-assistant
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rigel-assistant
subjects:
  - kind: ServiceAccount
    name: rigel-assistant
    namespace: default
---
# Reversible mutations only. `delete` is deliberately omitted → destructive is
# hard-blocked by default. To ENABLE deletes over chat (still confirmed with
# "yes"), add `delete` to the verb lists below.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rigel-assistant-write
  namespace: default   # ← the install namespace; duplicate for more namespaces
  labels:
    app.kubernetes.io/managed-by: rigel-assistant
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps, persistentvolumeclaims]
    verbs: [create, update, patch]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets, statefulsets, daemonsets,
                deployments/scale, statefulsets/scale]
    verbs: [create, update, patch]
  - apiGroups: ["batch"]
    resources: [jobs, cronjobs]
    verbs: [create, update, patch]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses]
    verbs: [create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rigel-assistant-write
  namespace: default
  labels:
    app.kubernetes.io/managed-by: rigel-assistant
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rigel-assistant-write
subjects:
  - kind: ServiceAccount
    name: rigel-assistant
    namespace: default
---
# Namespaced role for the agent's OWN state ConfigMaps. Scoped by resourceNames
# to the three assistant ConfigMaps; no `create` needed because the install
# pre-creates them empty (see configmaps.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rigel-assistant-state
  namespace: default
  labels:
    app.kubernetes.io/managed-by: rigel-assistant
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [assistant-config, assistant-state, assistant-backups]
    verbs: [get, update, patch]
  # Fix-PR orchestration. For each approved openFixPR the agent creates a per-fix
  # `rigel-fix-<id>` ConfigMap (the fix spec) + a one-shot Job that opens the PR.
  # `create` carries no object name yet, so it can't be resourceName-scoped — this
  # is ns-scoped to the state namespace instead. (get/list/watch on configmaps and
  # jobs are already granted cluster-wide by the ClusterRole above for diagnosis;
  # listed here too so the namespaced role is self-describing.)
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create, delete]
  - apiGroups: ["batch"]
    resources: [jobs]
    verbs: [create, delete, get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rigel-assistant-state
  namespace: default
  labels:
    app.kubernetes.io/managed-by: rigel-assistant
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rigel-assistant-state
subjects:
  - kind: ServiceAccount
    name: rigel-assistant
    namespace: default
---
# ─────────────────────────────────────────────────────────────────────────────
# The fix-runner Job's ServiceAccount. The other half of the privilege split:
# this SA holds the GitHub token (mounted from the `rigel-github` Secret) but has
# ZERO cluster access — DELIBERATELY no Role/RoleBinding/ClusterRoleBinding. A
# fix Job only uses its mounted Secret + per-fix ConfigMap and outbound git/HTTPS
# to open a PR; it never talks to the API server (its pod even sets
# automountServiceAccountToken: false). So the token-holding pod can't touch the
# cluster, and the cluster-capable agent never holds the token.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rigel-fix-runner
  namespace: default
  labels:
    app.kubernetes.io/name: rigel-fix-runner
    app.kubernetes.io/managed-by: rigel-assistant
automountServiceAccountToken: false
