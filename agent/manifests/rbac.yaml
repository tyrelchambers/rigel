apiVersion: v1
kind: ServiceAccount
metadata:
  name: rigel-assistant
  namespace: default
  labels:
    app.kubernetes.io/name: rigel-assistant
    app.kubernetes.io/managed-by: rigel-assistant
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rigel-assistant
  labels:
    app.kubernetes.io/managed-by: rigel-assistant
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, pods/status, nodes, events, namespaces, services,
                endpoints, persistentvolumeclaims, persistentvolumes,
                replicationcontrollers, configmaps, serviceaccounts, resourcequotas, limitranges]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [services/proxy]
    verbs: [get]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets, statefulsets, daemonsets, deployments/scale, statefulsets/scale]
    verbs: [get, list, watch]
  - apiGroups: ["batch"]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: ["policy"]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: ["autoscaling"]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: ["events.k8s.io"]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: ["metrics.k8s.io"]
    resources: [pods, nodes]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods, services, configmaps, persistentvolumeclaims]
    verbs: [create, update, patch]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets, statefulsets, daemonsets, deployments/scale, statefulsets/scale]
    verbs: [create, update, patch]
  - apiGroups: ["batch"]
    resources: [jobs, cronjobs]
    verbs: [create, update, patch]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses]
    verbs: [create, update, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rigel-assistant
  labels:
    app.kubernetes.io/managed-by: rigel-assistant
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rigel-assistant
subjects:
  - kind: ServiceAccount
    name: rigel-assistant
    namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rigel-assistant-state
  namespace: default
  labels:
    app.kubernetes.io/managed-by: rigel-assistant
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [assistant-config, assistant-state, assistant-backups]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create, delete]
  - apiGroups: ["batch"]
    resources: [jobs]
    verbs: [create, delete, get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rigel-assistant-state
  namespace: default
  labels:
    app.kubernetes.io/managed-by: rigel-assistant
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rigel-assistant-state
subjects:
  - kind: ServiceAccount
    name: rigel-assistant
    namespace: default
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rigel-fix-runner
  namespace: default
  labels:
    app.kubernetes.io/name: rigel-fix-runner
    app.kubernetes.io/managed-by: rigel-assistant
automountServiceAccountToken: false
