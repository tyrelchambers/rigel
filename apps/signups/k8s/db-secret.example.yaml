# Template only — create the real Secret with `kubectl create secret` (Task 8 Step 3).
apiVersion: v1
kind: Secret
metadata:
  name: rigel-signups
  namespace: default
stringData:
  DATABASE_URL: postgres://rigel_app:CHANGEME@<cnpg-cluster>-rw.default.svc:5432/rigel
  APP_KEY: CHANGEME
  # Optional Kit (ConvertKit) sync. Without KIT_API_KEY the service still captures
  # signups to Postgres but creates no Kit subscriber (kit.ts returns a no-op).
  KIT_API_KEY: CHANGEME
  KIT_TAG_ID: "CHANGEME"   # numeric Kit tag id (waitlist tag = 20502352); omit to skip tagging
  # Transactional email for account sign-in OTP codes (Resend). Without RESEND_API_KEY
  # the waitlist still works but /auth/request cannot send codes (returns 502).
  RESEND_API_KEY: CHANGEME
  RESEND_FROM: "Rigel <login@rigel.run>"   # verified Resend sender; defaults to this if omitted
  # ── Stripe (billing) ──────────────────────────────────────────────────────
  # MODE = the key prefix. sk_live_/rk_live_ ⇒ LIVE; sk_test_/rk_test_ ⇒ TEST.
  # STRIPE_PRICE_ID MUST match the key's mode (a test key + a live price id is an
  # error). NEVER mix. The service logs its mode on boot and refuses to start on a
  # key/price mode mismatch. Keep two Secrets, one per mode:
  #   rigel-signups        (this file / production, api.rigel.run) → LIVE key + LIVE price
  #   rigel-signups-test   (test deployment)                        → TEST key + TEST price
  STRIPE_SECRET_KEY: "sk_live_..."   # restricted key: Entitlements=read, Customers/Checkout/BillingPortal=write
  STRIPE_PRICE_ID: "price_..."       # per-seat "Rigel Pro" recurring price (same mode as the key)
  # Base URL for Checkout success/cancel + Portal return. Must equal the desktop
  # build's SIGNUP_ENDPOINT (RIGEL_SIGNUP_ENDPOINT). Omit to default to api.rigel.run.
  # BILLING_ENDPOINT: "https://api.rigel.run"
