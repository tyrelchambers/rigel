apiVersion: apps/v1
kind: Deployment
metadata:
  name: rigel-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rigel-api
  template:
    metadata:
      labels:
        app: rigel-api
    spec:
      imagePullSecrets:
        - name: ghrc
      containers:
        - name: api
          image: ghcr.io/tyrelchambers/rigel-api:latest
          ports:
            - containerPort: 8080
          env:
            # Free public beta: every account is fully entitled (incl. the in-cluster
            # agent's premium surfaces — Matrix/Signal chat, notify, remediate, autofix);
            # Stripe billing is bypassed. Remove to return to paid entitlement.
            - name: RIGEL_FREE_BETA
              value: "true"
          envFrom:
            - secretRef:
                name: rigel-api
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
