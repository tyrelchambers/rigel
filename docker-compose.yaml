# Local dev backend for testing billing / entitlements end to end. NOT for production.
# Builds the `api` service from THIS working tree (so it includes the current
# branch's routes, not the published :latest image).
#
# The Docker engine is the remote node at 100.85.103.61 (`docker context show`
# should print `remote`), so containers and their published ports live there, not
# on this Mac. Postgres is the shared infra-postgres on that same node — this
# compose file does not run one. The api creates its own tables on boot.
#
# Usage:
#   1. Put your Stripe TEST-mode values in .env (STRIPE_SECRET_KEY, STRIPE_PRICE_ID)
#      plus RESEND_API_KEY for passwordless sign-in codes. See .env.
#   2. docker compose up --build
#      -> watch for "[api] Stripe: test mode (price price_...)" — that confirms your keys.
#   3. In another terminal, point the desktop at it:
#      RIGEL_SIGNUP_ENDPOINT=http://100.85.103.61:8080 pnpm --filter desktop dev
#
# For a clean slate, recreate the database on the remote node:
#   ssh docker-remote "docker exec infra-postgres psql -U postgres -c 'drop database rigel' \
#     -c 'create database rigel owner rigel'"

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "100.85.103.61:8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://rigel:rigel@100.85.103.61:5432/rigel?sslmode=disable
      APP_KEY: devkey
      # Must equal the desktop's RIGEL_SIGNUP_ENDPOINT so the app recognizes the
      # post-checkout redirect (Stripe returns to ${BILLING_ENDPOINT}/billing/complete).
      BILLING_ENDPOINT: http://100.85.103.61:8080
      # Secrets pulled from .env — TEST mode. The service refuses to boot on a
      # key/price mode mismatch, so a clean boot proves these are valid.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY in .env}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:?set STRIPE_PRICE_ID in .env}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:?set STRIPE_PUBLISHABLE_KEY in .env}
      RIGEL_FREE_BETA: ${RIGEL_FREE_BETA:?set RIGEL_FREE_BETA in .env}
      # Optional — needed for passwordless sign-in codes (reuse your prod Resend key).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-Rigel <login@rigel.run>}
